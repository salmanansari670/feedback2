<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TE Student Feedback</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div class="container">

    <h2>TE Student Feedback Form</h2>


    <div class="student-details">

        <input
            type="text"
            id="name"
            placeholder="Student Name"
            required
        >


        <input
            type="text"
            id="roll"
            placeholder="Roll Number"
            required
        >

    </div>


    <input
        type="hidden"
        id="year"
        value="TE"
    >


    <p class="note">

        Select only the subjects you have.
        Complete the feedback for the selected subjects
        and click "Submit All Feedback".

    </p>


    <div class="subject-selection">

        <h3>Select Your Subjects</h3>

        <div id="subjectSelection"></div>

    </div>


    <div
        id="subjectTabs"
        class="subject-tabs">
    </div>


    <form id="form">

        <div id="subjectContainer"></div>


        <div class="submit-area">

            <button
                type="submit"
                id="submitButton">

                Submit All Feedback

            </button>

        </div>

    </form>

</div>


<script src="te.js"></script>

</body>

</html>
